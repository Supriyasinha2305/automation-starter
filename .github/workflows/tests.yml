name: tests

on:
  push:
  pull_request:

jobs:
  playwright-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright browsers
        run: playwright install --with-deps chromium

      - name: Start PolicyHub
        run: |
          python -m venv policyhub-venv
          policyhub-venv/bin/pip install -r policyhub/requirements.txt
          POLICYHUB_PORT=6001 policyhub-venv/bin/python policyhub/run.py &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:6001/health > /dev/null && break
            sleep 1
          done

      - name: Run pytest
        env:
          POLICYHUB_URL: http://127.0.0.1:6001
        run: pytest --html=report.html --self-contained-html

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-html-report
          path: report.html
